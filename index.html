<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bedtime">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Bedtime Routine</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #121212;
      --text: #fff;
      --muted: #c7c7c7;
      --line: #404040;
      --focus: #ffd60a;
      --good: #34c759;
      --skip: #ff9f0a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      line-height: 1.4;
    }
    main { max-width: 680px; margin: 0 auto; padding: 24px 18px 48px; }
    h1 { font-size: 34px; margin: 0 0 22px; }
    h2 { font-size: 30px; margin: 0 0 14px; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: block; font-weight: 700; margin-bottom: 10px; }
    input, button {
      font: inherit;
      border-radius: 14px;
    }
    input[type="time"], input[type="text"] {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      background: #1c1c1e;
      color: #fff;
      border: 2px solid var(--line);
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      min-height: 62px;
      padding: 12px 16px;
      margin: 8px 0;
      border: 2px solid var(--line);
      background: #1c1c1e;
      color: #fff;
      font-weight: 700;
    }
    button:focus, input:focus {
      outline: 4px solid var(--focus);
      outline-offset: 2px;
    }
    .primary { border-color: var(--good); }
    .skip { border-color: var(--skip); }
    .secondary { color: var(--muted); }
    .task {
      padding: 22px;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 18px;
      margin: 18px 0;
    }
    .task-content {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .task-actions {
      margin-top: 10px;
    }
    #taskHeading {
      min-height: 86px;
    }
    .progress { font-size: 18px; color: var(--muted); margin-bottom: 8px; }
    .time-left { font-size: 22px; color: #fff; margin: 12px 0 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .task-edit {
      border-top: 1px solid var(--line);
      padding: 16px 0;
    }
    .task-edit:first-child { border-top: 0; }
    .small-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .small-row button { min-height: 50px; font-size: 17px; }
    .hidden { display: none !important; }
    .status {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  
    .primary {
      background: #00ff3c !important;
      color: #000 !important;
      border: 3px solid #fff !important;
      font-weight: 800;
    }
    .skip {
      background: #fff200 !important;
      color: #000 !important;
      border: 3px solid #fff !important;
      font-weight: 800;
    }

    #routine {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #routine.hidden {
      display: none !important;
    }
    #routine .task {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #routine .task-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 16px;
    }
    #routine .task-actions {
      flex: 0 0 auto;
      position: sticky;
      bottom: 0;
      background: var(--panel);
      padding-top: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 5;
    }

    #timeLeft {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
      font-size: clamp(44px, 11vw, 72px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 14px 12px;
      margin: 14px 0 8px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #050505;
      color: #ffffff;
    }

    h1, h2, h3 {
      text-align: center;
    }

    .bedtime-question {
      text-align: center;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 14px;
    }
    .time-picker {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: end;
      margin: 18px 0 24px;
    }
    .time-picker > div {
      min-width: 0;
    }
    .time-picker label {
      display: block;
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
    }
    #hourWheel,
    #minuteWheel {
      width: 100%;
      min-height: 60px;
      font: inherit;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      background: #1c1c1e;
      color: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
    }
    .time-separator {
      font-size: 34px;
      font-weight: 800;
      padding-bottom: 10px;
    }

    .wheel-picker {
      display: grid;
      grid-template-columns: 1fr auto 1fr 1fr;
      gap: 10px;
      align-items: end;
      margin: 18px 0 24px;
    }
    .wheel-column {
      min-width: 0;
    }
    .wheel-column label {
      display: block;
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .wheel-shell {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 6px;
      align-items: center;
    }
    .wheel-shell select {
      width: 100%;
      min-height: 132px;
      font: inherit;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      text-align-last: center;
      background: #111;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 16px;
      padding: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .wheel-shell option {
      padding: 8px 4px;
      background: #111;
      color: #fff;
    }
    .wheel-step {
      min-height: 44px;
      font-size: 24px;
      font-weight: 800;
      border-radius: 12px;
      border: 2px solid #fff;
      background: #2a2a2a;
      color: #fff;
    }
    .wheel-separator {
      font-size: 38px;
      font-weight: 800;
      padding-bottom: 90px;
      align-self: end;
    }
    @media (max-width: 430px) {
      .wheel-picker {
        grid-template-columns: 1fr auto 1fr;
      }
      .wheel-picker .wheel-column:last-child {
        grid-column: 1 / -1;
        width: 45%;
        justify-self: center;
      }
    }

.simple-time-picker{text-align:center;margin:18px 0 24px}.selected-bedtime{font-size:clamp(46px,13vw,78px);font-weight:800;font-variant-numeric:tabular-nums;margin:12px 0 20px}.time-adjust-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.time-adjust-buttons button{min-height:64px;font-size:20px;font-weight:800}@media(max-width:380px){.time-adjust-buttons{grid-template-columns:1fr}}
    #timeLeft {
      white-space: nowrap;
      line-height: 1;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #routine .task-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 20px;
    }
    #routine .task-actions {
      flex: 0 0 auto;
      position: sticky;
      bottom: 0;
      background: var(--panel);
      padding-top: 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 10;
    }
    #routine .task-actions button {
      margin-bottom: 12px;
    }

</style>
</head>
<body>
<main>
  <section id="setup">
    <h1>Good evening Maysa.</h1>
    <p class="bedtime-question">What time would you like to go to bed?</p>
    <div class="simple-time-picker" role="group" aria-label="Choose bedtime">
      <div id="selectedBedtime" class="selected-bedtime" role="status" aria-live="polite">--:--</div>
      <div class="time-adjust-buttons"><button type="button" id="add15Btn">+15 minutes</button><button type="button" id="addHourBtn">+1 hour</button></div>
    </div>
    <button id="startBtn" class="primary">Start routine</button>
    <button id="editBtn" class="secondary">Edit tasks</button>
  </section>

  <section id="routine" class="hidden" aria-labelledby="taskHeading">
    <div class="progress" id="progress"></div>
    <div class="task">
      <div class="task-content">
        <h2 id="taskHeading" tabindex="-1"></h2>
        <div class="time-left" id="timeLeft" aria-live="off"></div>
      </div>
      <div class="task-actions">
        <button id="doneBtn" class="primary">Done</button>
        <button id="skipBtn" class="skip">Skip</button>
      </div>
    </div>
    <button id="restartBtn" class="secondary">Restart routine</button>
    <button id="stopBtn" class="secondary">End routine</button>
  </section>

  <section id="complete" class="hidden">
    <h1 id="sleepHeading" tabindex="-1">Have a beautiful sleep Maysa.</h1>
    <button id="againBtn" class="primary">Return to start</button>
  </section>

  <section id="editor" class="hidden">
    <h1>Edit tasks</h1>
    <div id="taskList"></div>
    <label for="newTask">Add a task</label>
    <input id="newTask" type="text" autocomplete="off">
    <button id="addTaskBtn" class="primary">Add task</button>
    <button id="saveTasksBtn">Done editing</button>
  </section>

  <div id="live" class="status" aria-live="assertive" aria-atomic="true"></div>
</main>

<script>

  // Short confirmation click for every button press.
  let clickAudioContext = null;
  function playButtonClick() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!clickAudioContext) clickAudioContext = new AudioCtx();
      if (clickAudioContext.state === "suspended") clickAudioContext.resume();

      const now = clickAudioContext.currentTime;
      const oscillator = clickAudioContext.createOscillator();
      const gain = clickAudioContext.createGain();

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(900, now);
      gain.gain.setValueAtTime(0.045, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

      oscillator.connect(gain);
      gain.connect(clickAudioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.025);
    } catch (_) {}
  }

  document.addEventListener("click", event => {
    if (event.target.closest("button")) playButtonClick();
  }, true);


(() => {
  const DEFAULT_TASKS = [
    "Close shutters and check doors and gate are locked",
    "Turn on sauna",
    "Load and start washing machine",
    "Clean coffee machine",
    "Clean sink and load dishwasher",
    "Take out rubbish and change bin bag",
    "Turn on jug",
    "Refresh Tamara’s water",
    "Give Tamara her greenie",
    "Toilet Tamara",
    "Make a cup of tea",
    "Turn off heater, TV, radio and lights",
    "Pack work, judo and gym bag",
    "Use sauna",
    "Shower and brush teeth",
    "Jump into bed"
];

  let tasks = loadTasks();
  let queue = [];
  let currentIndex = 0;
  let bedtimeDate = null;
  let saunaReady = null;
  let countdownTimer = null;
  let advancing = false;

  const $ = id => document.getElementById(id);
  const screens = ["setup", "routine", "complete", "editor"];

  function show(id) {
    screens.forEach(s => $(s).classList.toggle("hidden", s !== id));
    setTimeout(() => {
      const heading = $(id).querySelector("h1,h2,input,button");
      if (heading) heading.focus?.();
    }, 50);
  }

  function loadTasks() {
    try {
      const saved = JSON.parse(localStorage.getItem("bedtimeTasks") || "null");
      return Array.isArray(saved) && saved.length ? saved : [...DEFAULT_TASKS];
    } catch { return [...DEFAULT_TASKS]; }
  }

  function saveTasks() {
    localStorage.setItem("bedtimeTasks", JSON.stringify(tasks));
  }

  function speak(text) {
    $("live").textContent = "";
    setTimeout(() => $("live").textContent = text, 20);
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }
  }

  function normalizeQuarterHour(value) {
    const [h, m] = value.split(":").map(Number);
    const rounded = Math.round(m / 15) * 15;
    const d = new Date();
    d.setHours(h, rounded, 0, 0);
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }

  function resolveBedtime(value) {
    value = normalizeQuarterHour(value);
    const [h, m] = value.split(":").map(Number);
    const now = new Date();
    const target = new Date(now);
    target.setHours(h, m, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
    return target;
  }

  function remainingText() {
    if (!bedtimeDate) return "";
    const ms = bedtimeDate - new Date();
    const mins = Math.max(0, Math.ceil(ms / 60000));
    if (mins === 0) return "Time remaining: Bedtime now.";
    const hours = Math.floor(mins / 60);
    const remainder = mins % 60;
    if (hours > 0 && remainder > 0) return `Time remaining: ${hours} ${hours === 1 ? "hour" : "hours"} ${remainder} ${remainder === 1 ? "minute" : "minutes"}.`;
    if (hours > 0) return `Time remaining: ${hours} ${hours === 1 ? "hour" : "hours"}.`;
    return `Time remaining: ${mins} ${mins === 1 ? "minute" : "minutes"}.`;
  }

  function currentTask() { return queue[currentIndex] || null; }

  function displayRemainingText() {
    const ms = bedtimeDate - new Date();
    const mins = Math.max(0, Math.ceil(ms / 60000));
    if (mins === 0) return "00:00";
    const hours = Math.floor(mins / 60);
    const remainder = mins % 60;
    return `${String(hours).padStart(2,"0")}:${String(remainder).padStart(2,"0")}`;
  }

  function updateCountdown() {
    if (bedtimeDate && !$("routine").classList.contains("hidden")) {
      $("timeLeft").textContent = displayRemainingText();
      $("timeLeft").setAttribute("aria-label", `Digital countdown ${displayRemainingText()}`);
    }
  }

  function startCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 10000);
  }

  function announceTask(afterAction = false) {
    updateCountdown();
    const task = currentTask();
    if (!task) return finishRoutine();

    // If Turn on sauna was skipped, Use sauna disappears automatically.
    if (task.toLowerCase() === "use sauna" && saunaReady === false) {
      currentIndex++;
      return announceTask(afterAction);
    }

    const time = remainingText();
    $("taskHeading").textContent = task;
    $("progress").textContent = `Task ${currentIndex + 1} of ${queue.length}`;
    $("timeLeft").textContent = displayRemainingText();
    $("timeLeft").setAttribute("aria-label", `Digital countdown ${displayRemainingText()}`);

    // One uninterrupted utterance after Done/Skip.
    if (afterAction) {
      speak(`Next task. ${task}. ${time}`);
    } else {
      speak(`${task}. ${time}`);
    }

    advancing = false;
    $("doneBtn").disabled = false;
    $("skipBtn").disabled = false;
    setTimeout(() => $("taskHeading").focus(), 80);
  }

  function advance(result) {
    if (advancing) return;
    advancing = true;
    $("doneBtn").disabled = true;
    $("skipBtn").disabled = true;
    const task = currentTask();
    if (!task) return;

    if (task.toLowerCase() === "turn on sauna") {
      saunaReady = result === "done";
    }

    currentIndex++;
    announceTask(true);
  }

  function finishRoutine() {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = null;
    show("complete");
    const message = "Have a beautiful sleep Maysa.";
    speak(message);
    setTimeout(() => $("sleepHeading").focus(), 80);
  }

  $("startBtn").addEventListener("click", () => {
    try {
      if (!selectedBedtimeDate) return;
      bedtimeDate = new Date(selectedBedtimeDate);
      queue = [...tasks];
      currentIndex = 0;
      saunaReady = null;
      advancing = false;
      show("routine");
      startCountdown();
      announceTask();
    } catch (err) {
      alert("The routine could not start: " + (err && err.message ? err.message : err));
    }
  });

  $("doneBtn").addEventListener("click", () => advance("done"));
  $("skipBtn").addEventListener("click", () => advance("skip"));
  $("restartBtn").addEventListener("click", () => {
    currentIndex = 0;
    saunaReady = null;
    advancing = false;
    startCountdown();
    announceTask();
  });
  $("stopBtn").addEventListener("click", () => {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = null;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    show("setup");
  });
  $("againBtn").addEventListener("click", () => show("setup"));

  $("editBtn").addEventListener("click", () => {
    renderEditor();
    show("editor");
  });

  function renderEditor() {
    const root = $("taskList");
    root.innerHTML = "";
    tasks.forEach((task, i) => {
      const box = document.createElement("div");
      box.className = "task-edit";

      const label = document.createElement("label");
      label.textContent = `Task ${i + 1}`;
      label.htmlFor = `task-${i}`;

      const input = document.createElement("input");
      input.type = "text";
      input.id = `task-${i}`;
      input.value = task;
      input.addEventListener("change", e => {
        tasks[i] = e.target.value.trim() || task;
      });

      const row = document.createElement("div");
      row.className = "small-row";

      const up = document.createElement("button");
      up.textContent = "Move up";
      up.disabled = i === 0;
      up.addEventListener("click", () => {
        [tasks[i-1], tasks[i]] = [tasks[i], tasks[i-1]];
        renderEditor();
      });

      const down = document.createElement("button");
      down.textContent = "Move down";
      down.disabled = i === tasks.length - 1;
      down.addEventListener("click", () => {
        [tasks[i+1], tasks[i]] = [tasks[i], tasks[i+1]];
        renderEditor();
      });

      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.addEventListener("click", () => {
        tasks.splice(i, 1);
        renderEditor();
      });

      row.append(up, down, remove);
      box.append(label, input, row);
      root.append(box);
    });
  }

  $("addTaskBtn").addEventListener("click", () => {
    const value = $("newTask").value.trim();
    if (!value) return;
    tasks.push(value);
    $("newTask").value = "";
    renderEditor();
    speak(`${value} added.`);
  });

  $("saveTasksBtn").addEventListener("click", () => {
    tasks = tasks.map(t => t.trim()).filter(Boolean);
    if (!tasks.length) tasks = [...DEFAULT_TASKS];
    saveTasks();
    show("setup");
    speak("Tasks saved.");
  });

  let selectedBedtimeDate=new Date();
  selectedBedtimeDate.setMinutes(Math.ceil(selectedBedtimeDate.getMinutes()/15)*15,0,0);
  function updateSelectedBedtime(){const text=new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit",hour12:true}).format(selectedBedtimeDate);$("selectedBedtime").textContent=text;$("selectedBedtime").setAttribute("aria-label",`Selected bedtime ${text}`);}
  $("add15Btn").addEventListener("click",()=>{selectedBedtimeDate=new Date(selectedBedtimeDate.getTime()+15*60000);updateSelectedBedtime();});
  $("addHourBtn").addEventListener("click",()=>{selectedBedtimeDate=new Date(selectedBedtimeDate.getTime()+60*60000);updateSelectedBedtime();});
  updateSelectedBedtime();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js?v=13").catch(() => {});
  }
})();
</script>
</body>
</html>
