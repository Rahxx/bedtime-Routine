<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bedtime">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Bedtime Routine</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #121212;
      --text: #fff;
      --muted: #c7c7c7;
      --line: #404040;
      --focus: #ffd60a;
      --good: #34c759;
      --skip: #ff9f0a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      line-height: 1.4;
    }
    main { max-width: 680px; margin: 0 auto; padding: 24px 18px 48px; }
    h1 { font-size: 34px; margin: 0 0 22px; }
    h2 { font-size: 30px; margin: 0 0 14px; }
    p { margin: 8px 0 18px; color: var(--muted); }
    label { display: block; font-weight: 700; margin-bottom: 10px; }
    input, button {
      font: inherit;
      border-radius: 14px;
    }
    input[type="time"], input[type="text"] {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      background: #1c1c1e;
      color: #fff;
      border: 2px solid var(--line);
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      min-height: 62px;
      padding: 12px 16px;
      margin: 8px 0;
      border: 2px solid var(--line);
      background: #1c1c1e;
      color: #fff;
      font-weight: 700;
    }
    button:focus, input:focus {
      outline: 4px solid var(--focus);
      outline-offset: 2px;
    }
    .primary { border-color: var(--good); }
    .skip { border-color: var(--skip); }
    .secondary { color: var(--muted); }
    .task {
      padding: 22px;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 18px;
      margin: 18px 0;
    }
    .task-content {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .task-actions {
      margin-top: 10px;
    }
    #taskHeading {
      min-height: 86px;
    }
    .progress { font-size: 18px; color: var(--muted); margin-bottom: 8px; }
    .time-left { font-size: 22px; color: #fff; margin: 12px 0 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .task-edit {
      border-top: 1px solid var(--line);
      padding: 16px 0;
    }
    .task-edit:first-child { border-top: 0; }
    .small-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .small-row button { min-height: 50px; font-size: 17px; }
    .hidden { display: none !important; }
    .status {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  
    .primary {
      background: #00ff3c !important;
      color: #000 !important;
      border: 3px solid #fff !important;
      font-weight: 800;
    }
    .skip {
      background: #fff200 !important;
      color: #000 !important;
      border: 3px solid #fff !important;
      font-weight: 800;
    }

    #routine {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #routine.hidden {
      display: none !important;
    }
    #routine .task {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #routine .task-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 16px;
    }
    #routine .task-actions {
      flex: 0 0 auto;
      position: sticky;
      bottom: 0;
      background: var(--panel);
      padding-top: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 5;
    }

    #timeLeft {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
      font-size: clamp(44px, 11vw, 72px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 14px 12px;
      margin: 14px 0 8px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #050505;
      color: #ffffff;
    }

    h1, h2, h3 {
      text-align: center;
    }

    .bedtime-question {
      text-align: center;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 14px;
    }
    .time-picker {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: end;
      margin: 18px 0 24px;
    }
    .time-picker > div {
      min-width: 0;
    }
    .time-picker label {
      display: block;
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
    }
    #hourWheel,
    #minuteWheel {
      width: 100%;
      min-height: 60px;
      font: inherit;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      background: #1c1c1e;
      color: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
    }
    .time-separator {
      font-size: 34px;
      font-weight: 800;
      padding-bottom: 10px;
    }

    .wheel-picker {
      display: grid;
      grid-template-columns: 1fr auto 1fr 1fr;
      gap: 10px;
      align-items: end;
      margin: 18px 0 24px;
    }
    .wheel-column {
      min-width: 0;
    }
    .wheel-column label {
      display: block;
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .wheel-shell {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 6px;
      align-items: center;
    }
    .wheel-shell select {
      width: 100%;
      min-height: 132px;
      font: inherit;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      text-align-last: center;
      background: #111;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 16px;
      padding: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .wheel-shell option {
      padding: 8px 4px;
      background: #111;
      color: #fff;
    }
    .wheel-step {
      min-height: 44px;
      font-size: 24px;
      font-weight: 800;
      border-radius: 12px;
      border: 2px solid #fff;
      background: #2a2a2a;
      color: #fff;
    }
    .wheel-separator {
      font-size: 38px;
      font-weight: 800;
      padding-bottom: 90px;
      align-self: end;
    }
    @media (max-width: 430px) {
      .wheel-picker {
        grid-template-columns: 1fr auto 1fr;
      }
      .wheel-picker .wheel-column:last-child {
        grid-column: 1 / -1;
        width: 45%;
        justify-self: center;
      }
    }

    .preset-bedtimes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      margin: 18px 0;
    }

    .other-time-control {

    .other-time-label {

    }

    }
#selectedBedtime {

    /* v18: keep the countdown fully visible above Done/Skip */

}

</style>

<body>
<main>
  <section id="setup">
    <h1>Good evening Maysa.</h1>
    <p class="bedtime-question">What time would you like to go to bed?</p>
    <div id="selectedBedtime" class="selected-bedtime" role="status" aria-live="polite">
      <div class="selected-bedtime-label">Selected bedtime</div>
      <div id="selectedBedtimeTime" class="selected-bedtime-time">--:--</div>
    </div>
    <div class="preset-bedtimes" role="group" aria-label="Choose bedtime">
      <button type="button" class="bedtime-preset" data-time="22:00">10:00 PM</button>
      <button type="button" class="bedtime-preset" data-time="22:30">10:30 PM</button>
      <button type="button" class="bedtime-preset" data-time="23:00">11:00 PM</button>
      <button type="button" class="bedtime-preset" data-time="23:30">11:30 PM</button>
      <div class="other-time-control">
        <span class="other-time-label" aria-hidden="true">Other time</span>
        <input id="otherTimeInput" type="time" step="900" aria-label="Other time">
      </div>
    </div>

    <button id="startBtn" class="primary">Start routine</button>
    <button id="editBtn" class="secondary">Edit tasks</button>
  
<div class="voice-settings" aria-labelledby="voiceSettingsHeading">
      <h2 id="voiceSettingsHeading" class="voice-settings-heading">Voice announcements</h2>
      <button type="button" id="voiceToggleBtn" class="voice-toggle" aria-pressed="true">Voice announcements: On</button>

      <label for="voiceSelect" class="voice-label">Voice</label>
      <select id="voiceSelect" class="voice-select" aria-describedby="voiceCount"></select>
      <div id="voiceCount" class="voice-count" role="status" aria-live="polite">Loading voices…</div>

      <button type="button" id="previewVoiceBtn" class="voice-preview">Preview voice</button>
    </div>
  </section>

  <section id="routine" class="hidden" aria-labelledby="taskHeading">
    <div class="progress" id="progress"></div>
    <div class="task">
      <div class="task-content">
        <button type="button" id="taskHeading" class="task-repeat" aria-label="Repeat task announcement"></button>
        <div id="moveFeedback" class="move-feedback" role="status" aria-live="polite"></div>
        <div class="time-left" id="timeLeft" aria-live="off"></div>
        <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
      </div>
      <div class="task-actions">
        <button id="doneBtn" class="primary">Done</button>
        <div class="secondary-actions">
          <button id="skipBtn" class="skip">Skip</button>
          <button id="laterBtn" class="later" aria-label="Do later, moves this task two tasks later">Do Later</button>
        </div>
      </div>
    </div>
    <button id="restartBtn" class="secondary">Restart routine</button>
    <button id="stopBtn" class="secondary">End routine</button>
  </section>

  <section id="complete" class="hidden">
    <h1 id="sleepHeading" tabindex="-1">Have a beautiful sleep Maysa.</h1>
    <button id="againBtn" class="primary">Return to start</button>
  </section>

  <section id="editor" class="hidden">
    <h1>Edit tasks</h1>
    <div id="taskList"></div>
    <label for="newTask">Add a task</label>
    <input id="newTask" type="text" autocomplete="off">
    <button id="addTaskBtn" class="primary">Add task</button>
    <button id="saveTasksBtn">Done editing</button>
  </section>

  <div id="live" class="status" aria-live="assertive" aria-atomic="true"></div>
</main>

<script>

  // Short confirmation click for every button press.
  let clickAudioContext = null;
  function playButtonClick() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!clickAudioContext) clickAudioContext = new AudioCtx();
      if (clickAudioContext.state === "suspended") clickAudioContext.resume();

      const now = clickAudioContext.currentTime;
      const oscillator = clickAudioContext.createOscillator();
      const gain = clickAudioContext.createGain();

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(900, now);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

      oscillator.connect(gain);
      gain.connect(clickAudioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.025);
    } catch (_) {}
  }

  document.addEventListener("click", event => {
    if (event.target.closest("button")) playButtonClick();
  }, true);


(() => {
  const DEFAULT_TASKS = [
    "Close shutters and check doors and gate are locked",
    "Turn on sauna",
    "Load and start washing machine",
    "Clean coffee machine",
    "Clean sink and load dishwasher",
    "Take out rubbish and change bin bag",
    "Turn on jug",
    "Refresh Tamara’s water",
    "Toilet Tamara",
    "Give Tamara her greenie",
    "Make a cup of tea",
    "Turn off heater, TV, radio and lights",
    "Pack work, judo and gym bag",
    "Use sauna",
    "Shower and brush teeth",
    "Jump into bed"
];

  let tasks = loadTasks();
  let queue = [];
  let currentIndex = 0;
  let bedtimeDate = null;
  let saunaReady = null;
  let jugReady = null;
  let countdownTimer = null;
  let advancing = false;

  const $ = id => document.getElementById(id);
  const screens = ["setup", "routine", "complete", "editor"];

  function show(id) {
    screens.forEach(s => $(s).classList.toggle("hidden", s !== id));
    setTimeout(() => {
      const heading = $(id).querySelector("h1,h2,input,button");
      if (heading) heading.focus?.();
    }, 50);
  }

  function loadTasks() {
    try {
      const saved = JSON.parse(localStorage.getItem("bedtimeTasks") || "null");
      return Array.isArray(saved) && saved.length ? saved : [...DEFAULT_TASKS];
    } catch { return [...DEFAULT_TASKS]; }
  }

  function saveTasks() {
    localStorage.setItem("bedtimeTasks", JSON.stringify(tasks));
  }

  // Keep existing users on the updated default Tamara ordering unless they have
  // substantially customised the list.
  const oldTamaraOrder = ["Refresh Tamara’s water", "Give Tamara her greenie", "Toilet Tamara"];
  const newTamaraOrder = ["Refresh Tamara’s water", "Toilet Tamara", "Give Tamara her greenie"];
  const tamaraStart = tasks.findIndex((task, i) =>
    task === oldTamaraOrder[0] &&
    tasks[i + 1] === oldTamaraOrder[1] &&
    tasks[i + 2] === oldTamaraOrder[2]
  );
  if (tamaraStart !== -1) {
    tasks.splice(tamaraStart, 3, ...newTamaraOrder);
    saveTasks();
  }


  let voiceAnnouncementsEnabled = localStorage.getItem("voiceAnnouncementsEnabled") !== "false";
  let selectedVoiceURI = localStorage.getItem("selectedVoiceURI") || "";
  let availableEnglishVoices = [];

  let activeUtterance = null;
  let speechTimer = null;

  function speak(text) {
    if (!voiceAnnouncementsEnabled) return;

    // Keep the VoiceOver live-region announcement as a fallback while announcements are on.
    $("live").textContent = "";
    setTimeout(() => {
      if (voiceAnnouncementsEnabled) $("live").textContent = text;
    }, 20);

    if (!("speechSynthesis" in window)) return;

    if (speechTimer) {
      clearTimeout(speechTimer);
      speechTimer = null;
    }

    window.speechSynthesis.cancel();

    speechTimer = setTimeout(() => {
      if (!voiceAnnouncementsEnabled) return;

      activeUtterance = new SpeechSynthesisUtterance(text);
      activeUtterance.rate = 1.10;
      activeUtterance.volume = 1;

      const selectedVoice = availableEnglishVoices.find(v => v.voiceURI === selectedVoiceURI);
      if (selectedVoice) {
        activeUtterance.voice = selectedVoice;
        activeUtterance.lang = selectedVoice.lang;
      }

      activeUtterance.onend = () => {
        activeUtterance = null;
      };

      activeUtterance.onerror = () => {
        activeUtterance = null;
      };

      window.speechSynthesis.resume();
      window.speechSynthesis.speak(activeUtterance);
      speechTimer = null;
    }, 90);
  }

  function normalizeQuarterHour(value) {
    const [h, m] = value.split(":").map(Number);
    const rounded = Math.round(m / 15) * 15;
    const d = new Date();
    d.setHours(h, rounded, 0, 0);
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }

  function resolveBedtime(value) {
    value = normalizeQuarterHour(value);
    const [h, m] = value.split(":").map(Number);
    const now = new Date();
    const target = new Date(now);
    target.setHours(h, m, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
    return target;
  }

  function remainingText() {
    if (!bedtimeDate) return "";
    const ms = bedtimeDate - new Date();
    const mins = Math.max(0, Math.ceil(ms / 60000));
    if (mins === 0) return "Time remaining: Bedtime now.";
    const hours = Math.floor(mins / 60);
    const remainder = mins % 60;
    if (hours > 0 && remainder > 0) return `Time remaining: ${hours} ${hours === 1 ? "hour" : "hours"} ${remainder} ${remainder === 1 ? "minute" : "minutes"}.`;
    if (hours > 0) return `Time remaining: ${hours} ${hours === 1 ? "hour" : "hours"}.`;
    return `Time remaining: ${mins} ${mins === 1 ? "minute" : "minutes"}.`;
  }

  function currentTask() { return queue[currentIndex] || null; }

  function displayRemainingText() {
    const ms = bedtimeDate - new Date();
    const mins = Math.max(0, Math.ceil(ms / 60000));
    const hours = Math.floor(mins / 60);
    const remainder = mins % 60;
    return `${String(hours).padStart(2,"0")}:${String(remainder).padStart(2,"0")}`;
  }

  function updateCountdown() {
    if (bedtimeDate && !$("routine").classList.contains("hidden")) {
      $("timeLeft").textContent = displayRemainingText();
      $("timeLeft").setAttribute("aria-label", `Digital countdown ${displayRemainingText()}`);
    }
  }

  function startCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 10000);
  }

  function announceTask(afterAction = false, speechPrefix = "") {
    updateCountdown();
    const task = currentTask();
    if (!task) return finishRoutine();

    // Dependent tasks disappear when their setup task was skipped.
    if (task.toLowerCase() === "use sauna" && saunaReady === false) {
      currentIndex++;
      return announceTask(afterAction, speechPrefix);
    }
    if (task.toLowerCase() === "make a cup of tea" && jugReady === false) {
      currentIndex++;
      return announceTask(afterAction, speechPrefix);
    }

    const time = remainingText();
    $("taskHeading").textContent = task;
    $("progress").textContent = `Task ${currentIndex + 1} of ${queue.length}`;
    $("progressBar").style.width = `${Math.min(100, ((currentIndex + 1) / queue.length) * 100)}%`;
    $("timeLeft").textContent = displayRemainingText();
    $("timeLeft").setAttribute("aria-label", remainingText().replace("Time remaining: ", ""));

    if (speechPrefix) {
      speak(`${speechPrefix} Next task. ${task}. ${time}`);
    } else if (afterAction) {
      speak(`Next task. ${task}. ${time}`);
    } else {
      speak(`${task}. ${time}`);
    }

    advancing = false;
    $("doneBtn").disabled = false;
    $("skipBtn").disabled = false;
    $("laterBtn").disabled = false;
    setTimeout(() => $("taskHeading").focus(), 80);
  }

  function advance(result) {
    if (advancing) return;
    advancing = true;
    $("doneBtn").disabled = true;
    $("skipBtn").disabled = true;
    $("laterBtn").disabled = true;
    const task = currentTask();
    if (!task) return;

    if (task.toLowerCase() === "turn on sauna") {
      saunaReady = result === "done";
    }
    if (task.toLowerCase() === "turn on jug") {
      jugReady = result === "done";
    }

    currentIndex++;
    announceTask(true);
  }

  function finishRoutine() {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = null;
    show("complete");
    const message = "Have a beautiful sleep Maysa.";
    speak(message);
    setTimeout(() => $("sleepHeading").focus(), 80);
  }

  $("startBtn").addEventListener("click", () => {
    try {
      if (!selectedBedtimeDate) { alert("Please choose a bedtime first."); return; }
      bedtimeDate = new Date(selectedBedtimeDate);
      queue = [...tasks];
      currentIndex = 0;
      saunaReady = null;
      jugReady = null;
      advancing = false;
      show("routine");
      startCountdown();
      announceTask();
    } catch (err) {
      alert("The routine could not start: " + (err && err.message ? err.message : err));
    }
  });


  function updateVoiceControls() {
    $("voiceToggleBtn").setAttribute("aria-pressed", voiceAnnouncementsEnabled ? "true" : "false");
    $("voiceToggleBtn").textContent = `Voice announcements: ${voiceAnnouncementsEnabled ? "On" : "Off"}`;
    $("voiceSelect").disabled = !voiceAnnouncementsEnabled || availableEnglishVoices.length === 0;
    $("previewVoiceBtn").disabled = !voiceAnnouncementsEnabled || availableEnglishVoices.length === 0;
  }

  function loadVoices() {
    if (!("speechSynthesis" in window)) {
      availableEnglishVoices = [];
      $("voiceSelect").innerHTML = "";
      $("voiceCount").textContent = "Speech voices are not available in this browser.";
      updateVoiceControls();
      return;
    }

    const voices = window.speechSynthesis.getVoices();
    availableEnglishVoices = voices
      .filter(v => /^en(?:-|_)/i.test(v.lang))
      .sort((a, b) => {
        const langCompare = a.lang.localeCompare(b.lang);
        if (langCompare !== 0) return langCompare;
        return a.name.localeCompare(b.name);
      });

    const select = $("voiceSelect");
    select.innerHTML = "";

    availableEnglishVoices.forEach((voice, index) => {
      const option = document.createElement("option");
      option.value = voice.voiceURI;
      option.textContent = `${voice.name} — ${voice.lang}`;
      select.appendChild(option);
    });

    if (availableEnglishVoices.length) {
      const savedStillExists = availableEnglishVoices.some(v => v.voiceURI === selectedVoiceURI);
      if (!savedStillExists) {
        const defaultVoice = availableEnglishVoices.find(v => v.default) || availableEnglishVoices[0];
        selectedVoiceURI = defaultVoice.voiceURI;
        localStorage.setItem("selectedVoiceURI", selectedVoiceURI);
      }
      select.value = selectedVoiceURI;
    }

    const count = availableEnglishVoices.length;
    $("voiceCount").textContent = `${count} English ${count === 1 ? "voice" : "voices"} available on this device.`;
    updateVoiceControls();
  }

  $("voiceToggleBtn").addEventListener("click", () => {
    voiceAnnouncementsEnabled = !voiceAnnouncementsEnabled;
    localStorage.setItem("voiceAnnouncementsEnabled", voiceAnnouncementsEnabled ? "true" : "false");

    if (!voiceAnnouncementsEnabled) {
      if (speechTimer) {
        clearTimeout(speechTimer);
        speechTimer = null;
      }
      activeUtterance = null;
      $("live").textContent = "";
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }

    updateVoiceControls();
  });

  $("voiceSelect").addEventListener("change", () => {
    selectedVoiceURI = $("voiceSelect").value;
    localStorage.setItem("selectedVoiceURI", selectedVoiceURI);
  });

  $("previewVoiceBtn").addEventListener("click", () => {
    speak("This is the selected bedtime routine voice.");
  });

  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
    setTimeout(loadVoices, 250);
    setTimeout(loadVoices, 1000);
  } else {
    loadVoices();
  }

  $("doneBtn").addEventListener("click", () => advance("done"));
  $("skipBtn").addEventListener("click", () => advance("skip"));
  $("taskHeading").addEventListener("click", () => {
    const task = currentTask();
    if (!task) return;
    speak(`${task}. ${remainingText()}`);
  });

  $("laterBtn").addEventListener("click", () => {
    if (advancing) return;
    const task = currentTask();
    if (!task) return;

    advancing = true;
    $("doneBtn").disabled = true;
    $("skipBtn").disabled = true;
    $("laterBtn").disabled = true;

    const [movedTask] = queue.splice(currentIndex, 1);
    const targetIndex = Math.min(currentIndex + 2, queue.length);
    queue.splice(targetIndex, 0, movedTask);

    const feedback = $("moveFeedback");
    feedback.textContent = "Moved 2 tasks later";
    feedback.classList.add("show");

    // One complete announcement, so it cannot be cut off by the next task speech.
    announceTask(true, `${movedTask} moved two tasks later.`);

    setTimeout(() => {
      feedback.classList.remove("show");
      feedback.textContent = "";
    }, 1800);
  });
  $("restartBtn").addEventListener("click", () => {
    currentIndex = 0;
    saunaReady = null;
    jugReady = null;
    advancing = false;
    startCountdown();
    announceTask();
  });
  $("stopBtn").addEventListener("click", () => {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = null;
    if (speechTimer) {
      clearTimeout(speechTimer);
      speechTimer = null;
    }
    activeUtterance = null;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    show("setup");
  });
  $("againBtn").addEventListener("click", () => show("setup"));

  $("editBtn").addEventListener("click", () => {
    renderEditor();
    show("editor");
  });

  function renderEditor() {
    const root = $("taskList");
    root.innerHTML = "";
    tasks.forEach((task, i) => {
      const box = document.createElement("div");
      box.className = "task-edit";

      const label = document.createElement("label");
      label.textContent = `Task ${i + 1}`;
      label.htmlFor = `task-${i}`;

      const input = document.createElement("input");
      input.type = "text";
      input.id = `task-${i}`;
      input.value = task;
      input.addEventListener("change", e => {
        tasks[i] = e.target.value.trim() || task;
      });

      const row = document.createElement("div");
      row.className = "small-row";

      const up = document.createElement("button");
      up.textContent = "Move up";
      up.disabled = i === 0;
      up.addEventListener("click", () => {
        [tasks[i-1], tasks[i]] = [tasks[i], tasks[i-1]];
        renderEditor();
      });

      const down = document.createElement("button");
      down.textContent = "Move down";
      down.disabled = i === tasks.length - 1;
      down.addEventListener("click", () => {
        [tasks[i+1], tasks[i]] = [tasks[i], tasks[i+1]];
        renderEditor();
      });

      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.addEventListener("click", () => {
        tasks.splice(i, 1);
        renderEditor();
      });

      row.append(up, down, remove);
      box.append(label, input, row);
      root.append(box);
    });
  }

  $("addTaskBtn").addEventListener("click", () => {
    const value = $("newTask").value.trim();
    if (!value) return;
    tasks.push(value);
    $("newTask").value = "";
    renderEditor();
    speak(`${value} added.`);
  });

  $("saveTasksBtn").addEventListener("click", () => {
    tasks = tasks.map(t => t.trim()).filter(Boolean);
    if (!tasks.length) tasks = [...DEFAULT_TASKS];
    saveTasks();
    show("setup");
    speak("Tasks saved.");
  });

  let selectedBedtimeDate = null;

  function formatSelectedBedtime(date) {
    return new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }).format(date);
  }

  function buildFutureBedtime(hours, minutes) {
    const now = new Date();
    const date = new Date(now);
    date.setHours(hours, minutes, 0, 0);
    if (date <= now) date.setDate(date.getDate() + 1);
    return date;
  }

  function setSelectedBedtime(date) {
    selectedBedtimeDate = date;
    const text = formatSelectedBedtime(date);
    $("selectedBedtimeTime").textContent = text;
    $("selectedBedtime").setAttribute("aria-label", `Selected bedtime ${text}`);
  }

  document.querySelectorAll(".bedtime-preset").forEach(button => {
    button.addEventListener("click", () => {
      const [hours, minutes] = button.dataset.time.split(":").map(Number);
      setSelectedBedtime(buildFutureBedtime(hours, minutes));
    });
  });

  $("otherTimeInput").addEventListener("change", () => {
    const value = $("otherTimeInput").value;
    if (!value) return;
    const [hours, minutes] = value.split(":").map(Number);
    setSelectedBedtime(buildFutureBedtime(hours, minutes));
  });

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js?v=29").catch(() => {});
  }
})();

function highlightSelectedPreset(selectedButton) {
  document.querySelectorAll('.preset-btn, .preset-time, button[data-time]').forEach(button => {
    button.classList.remove('selected');
    button.setAttribute('aria-pressed', 'false');
  });
  if (selectedButton) {
    selectedButton.classList.add('selected');
    selectedButton.setAttribute('aria-pressed', 'true');
  }
}


document.addEventListener("click", event => {
  const button = event.target.closest('.preset-btn, .preset-time, button[data-time]');
  if (!button) return;
  highlightSelectedPreset(button);
});


const otherTimeInput = document.querySelector('input[type="time"]');
if (otherTimeInput) {
  otherTimeInput.addEventListener("change", () => highlightSelectedPreset(null));
}

</script>
</body>
</html>
